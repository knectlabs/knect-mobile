name: knect_mobile
description: Knect employee mobile app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.0
  geolocator: ^13.0.2
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.11.0
  image: ^4.3.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/knect_icon.png
    - assets/brand/knect_wordmark.png
    - assets/models/mobilefacenet.tflite
